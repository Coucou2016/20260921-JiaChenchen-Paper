dataset:
  root: dataset
  target: h_max
  geo_mode: all
  scenarios: [20a, 100a]
  pairs:
    - [20, 10]
    - [10, 5]
    - [30, 10]
    - [20, 5]

model:
  name: hydrogeo_srno
  hydro_encoder: {in_channels: 2, width: 64, blocks: 8}
  geo_encoder: {width: 48, in_cont: 14, landuse_embedding: 8, use_landuse: true}
  operator: {width: 192, heads: 8, layers: 2}
  depth_ref: 0.10

train:
  batch_size: 2
  epochs: 200
  amp: true
  num_workers: 0

optimizer:
  type: AdamW
  lr: 0.0001
  weight_decay: 0.00001

output:
  dir: outputs/v1_multiscale
