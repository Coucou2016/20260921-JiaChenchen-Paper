# CPU / pipeline smoke: few steps, tiny model, proves real patches + loss + checkpoint
dataset:
  root: dataset
  lr_res: 10
  hr_res: 2
  target: h_max
  geo_mode: all
  scenarios: [20a, 100a]

model:
  name: hydrogeo_srno
  hydro_encoder:
    in_channels: 2
    width: 32
    blocks: 2
  geo_encoder:
    width: 16
    in_cont: 14
    landuse_embedding: 4
    use_landuse: true
  operator:
    width: 64
    heads: 4
    layers: 1
  depth_ref: 0.10
  predict_residual: true
  predict_wet: true

loss:
  name: flood
  w_depth: 1.0
  w_wet: 0.30
  w_log: 0.20
  w_boundary: 0.10
  w_extreme: 0.10
  wet_threshold: 0.05

train:
  batch_size: 1
  epochs: 1
  max_steps: 3
  amp: false
  num_workers: 0
  max_grad_norm: 1.0
  seed: 42
  eval_max_batches: 2

optimizer:
  type: AdamW
  lr: 0.0001
  weight_decay: 0.00001

scheduler:
  type: cosine
  warmup_epochs: 0

early_stopping:
  metric: CSI_005
  mode: max
  patience: 40

augmentation:
  flip: false
  rotation: false

output:
  dir: outputs/smoke
  save_every: 1
